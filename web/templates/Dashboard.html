<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow p-4">
    <h1 class="text-xl font-bold text-center">📦 Asset Tracker</h1>
  </header>

  <!-- Controls -->
  <section class="p-4">
    <input
      type="text"
      id="searchBox"
      placeholder="Search assets..."
      class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring focus:border-blue-400"
    />
  </section>

  <!-- Data Table -->
  <main class="p-4">
    <div class="overflow-x-auto bg-white rounded-xl shadow-lg">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-200 text-gray-700 uppercase text-xs">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>
            <th class="px-4 py-3 text-left">Image</th>
            <th class="px-4 py-3 text-left">Name</th>
            <th class="px-4 py-3 text-left">Category</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-left">Last Updated</th>
          </tr>
        </thead>
        <tbody id="assetTable" class="divide-y divide-gray-100">
          <!-- Filled dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- JS: Load JSON from API and render -->
  <script>
    async function loadAssets() {
      const response = await fetch("{{ url_for('api_assets') }}");
      const assets = await response.json();
      const tableBody = document.getElementById("assetTable");
      tableBody.innerHTML = ""; // clear before inserting

      assets.forEach(asset => {
        const row = document.createElement("tr");
        row.classList.add("hover:bg-blue-50");
        row.innerHTML = `
          <td class="px-4 py-3">${asset.id}</td>
          <td class="px-4 py-3">
            ${asset.image_url ? `<img src="${asset.image_url}" alt="${asset.name}" class="h-12 w-12 object-cover rounded-md shadow"/>` : `<span class="text-gray-400">No Image</span>`}
          </td>
          <td class="px-4 py-3">${asset.name}</td>
          <td class="px-4 py-3">${asset.category}</td>
          <td class="px-4 py-3 ${asset.status === 'Available' ? 'text-green-600 font-medium' : 'text-red-600 font-medium'}">
            ${asset.status}
          </td>
          <td class="px-4 py-3">${asset.last_updated}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Search filter
    const searchBox = document.getElementById('searchBox');
    searchBox.addEventListener('keyup', function() {
      const query = this.value.toLowerCase();
      document.querySelectorAll('#assetTable tr').forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
      });
    });

    // Load on page start
    loadAssets();
  </script>
</body>
</html>
