<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow p-4">
    <h1 class="text-xl font-bold text-center">📦 Asset Tracker</h1>
  </header>

  <!-- Controls -->
  <section class="p-4">
    <input
      type="text"
      id="searchBox"
      placeholder="Search assets..."
      class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring focus:border-blue-400"
    />
  </section>

  <!-- Data Table -->
  <main class="p-4">
    <div class="overflow-x-auto bg-white rounded-xl shadow-lg">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-200 text-gray-700 uppercase text-xs">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>
            <th class="px-4 py-3 text-left">Name</th>
            <th class="px-4 py-3 text-left">Category</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-left">Last Updated</th>
          </tr>
        </thead>
        <tbody id="assetTable" class="divide-y divide-gray-100">
          <!-- Example row (replace with DB data loop in backend) -->
          <tr class="hover:bg-blue-50">
            <td class="px-4 py-3">001</td>
            <td class="px-4 py-3">Laptop</td>
            <td class="px-4 py-3">Electronics</td>
            <td class="px-4 py-3 text-green-600 font-medium">Available</td>
            <td class="px-4 py-3">2025-09-15</td>
          </tr>
          <tr class="hover:bg-blue-50">
            <td class="px-4 py-3">002</td>
            <td class="px-4 py-3">Projector</td>
            <td class="px-4 py-3">Electronics</td>
            <td class="px-4 py-3 text-red-600 font-medium">Checked Out</td>
            <td class="px-4 py-3">2025-09-10</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Small JS for filtering -->
  <script>
    const searchBox = document.getElementById('searchBox');
    const tableRows = document.querySelectorAll('#assetTable tr');

    searchBox.addEventListener('keyup', function() {
      const query = this.value.toLowerCase();
      tableRows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
